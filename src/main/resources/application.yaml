spring:
  application:
    name: e-commerce
  datasource:
    url: jdbc:h2:file:./data/ecommerce;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
